name: Acceptance tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, mysql]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-only-password
          MYSQL_DATABASE: scholarmatch_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_CONNECTION: ${{ matrix.database }}
      DB_DATABASE: ${{ matrix.database == 'mysql' && 'scholarmatch_test' || ':memory:' }}
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: test-only-password
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, pdo_sqlite, intl
          coverage: none
      - run: composer install --prefer-dist --no-interaction
      - run: cp .env.example .env && php artisan key:generate
      - run: composer validate --strict
      - run: vendor/bin/pint --test
      - run: php artisan test --compact --log-junit artifacts/phpunit.xml
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite
          coverage: none
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: composer install --prefer-dist --no-interaction
      - run: cp .env.example .env && php artisan key:generate
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run check && pnpm test
